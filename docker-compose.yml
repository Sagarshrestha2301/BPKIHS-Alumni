services:
  db:
    image: postgres:16-alpine
    container_name: bpkihs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bpkihs
      POSTGRES_PASSWORD: bpkihs_dev
      POSTGRES_DB: bpkihs
    # Loopback only: a development database on port 5433 must not be reachable from the
    # local network. Production Postgres is never run from this file.
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - bpkihs_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bpkihs -d bpkihs']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bpkihs_pgdata:
    name: bpkihs_pgdata
